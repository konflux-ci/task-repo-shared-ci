name: Run Go CI
"on":
  pull_request:
    branches: [main]
    paths:
      - "ta-generator/**"
      - ".github/workflows/go-ci.yaml"
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  go:
    name: Check source code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ta-generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ta-generator/go.mod
          cache-dependency-path: ta-generator/go.sum
      - name: Check go mod status
        run: |
          go mod tidy
          if [[ -n "$(git status -s)" ]]; then
            echo "Go module state is not clean:"
            git --no-pager diff
            exit 1
          fi
      - name: Check format
        run: |
          go fmt ./...
          if [[ -n "$(git status -s)" ]]; then
            echo "Go files are not properly formatted:"
            git --no-pager diff
            exit 1
          fi
      - name: Check lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ta-generator
          args: --timeout=10m
      - name: Run unit tests
        run: |
          go test ./...

  security_scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ta-generator/go.mod
          cache-dependency-path: ta-generator/go.sum
      # https://github.com/securego/gosec/blob/12be14859bc7d4b956b71bef0b443694aa519d8a/README.md#integrating-with-code-scanning
      - name: Run Gosec Security Scanner
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          # We let the report trigger content trigger a failure using the GitHub Security features.
          args: "-no-fail -fmt sarif -out results.sarif ./ta-generator/..."
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
